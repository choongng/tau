# Pursuit goal — written on the user's behalf from their request (2026-10-03):
# "set up a pursuit to do some more iterations on this problem. i think five
# attempts each on the two models above" … "fix between runs, yes to grader
# and archive, run unattended" … "cap each run at one hour ; run completely
# unattended ; the primary signal will be in analyzing the traces regardless
# or success or failure, with a strong model this task is solvable in nearly
# one shot but the 9b model needs more structure and steps (that we are
# learning to provide)"
# Extended 2026-10-04 on the user's instruction ("you edit using your best
# judgement to reflect the new extended plan"), after "i think if we just cycle
# models and prompts (i added a second, cobs_prompt.txt), and fix the problems
# we see, we should be able to make progress. let's do two models and two
# prompts and authorize another 20 steps". R01-R20 ran under the ten-run
# wording (R11-R20 authorized separately on 2026-10-03).
# Extended again 2026-10-09: "let's keep thinking on, extend the round budget
# to 50 total, and add http://bane:8080/ui/#/models/gemma4-12b-q4 model to the
# rotation (so three total)". R21-R35 drivers ran thinking-off (the bane
