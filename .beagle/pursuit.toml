[goal]
statement = "Make tau+beagle give a small local model (9-12B) enough structure to take a small implementation prompt (~/tautest/itc_prompt.txt, interval tree clocks; ~/tautest/cobs_prompt.txt, consistent overhead byte stuffing; each in Python via a beagle pursuit) toward a correct, committed result, learning from the traces of unattended runs and fixing tau between runs, with fixes that hold across prompts and models rather than fitting one. The small models are a stress test: they surface often, and cheaply, failure behaviours that larger models show rarely, so the aim is tau+beagle that works better across models, and for each small model to complete the task at least some of the time."
criteria = [
  "Runs R01-R20 (itc_prompt.txt) and R21-R44 have been executed (R45-R50 were dropped by the owner on 2026-10-10 in favour of mining the existing traces). R21-R35 cycle mimo-v2.6-9b-q4 and qwen3.5-9b-q4-mtp-thinking-coding over the unchanged itc_prompt.txt and cobs_prompt.txt, so each block of four runs pairs each model with each prompt once; R36-R50 add gemma4-12b-q4 and cycle the three models, so each block of six runs pairs each model with each prompt once. Each run records the driver's thinking level. Each run starts from a clean project directory under a one-hour wall cap, with the model passed explicitly. R51-R70 run qwen3.6-35b-q6-mtp-thinking-coding (q35, krang) alternating itc_prompt.txt and cobs_prompt.txt, ten runs each, with plain-tau q35 baselines B04 (itc) and B05 (cobs) run before R51.",
  "Each run has a trace analysis in dev-notes/itc-runs/RNN.md naming its model and prompt. It holds a scorecard (founded and on which try; tasks done/abandoned/stalled; witnessed share; commits; breaker, length stops and compactions; finished on its own or capped; hidden-grader result) and the failure classes the trace shows, whether the run succeeded or not, each marked with the earlier runs and models it also appeared in.",
  "Each run's implementation is scored by a hidden acceptance suite for its prompt that the model never sees: for ITC, fork, event, join, leq, normalisation and the paper's examples; for COBS, the reference examples, round-trips, the no-zero and overhead properties, and malformed-input rejection.",
  "Every tau-side failure class named in a run analysis either has a fix committed on choong-dev with a regression test, made before the next run started, or a recorded reason it was deferred. A fix is stated in terms that do not depend on one prompt's domain or wording, or on one model's habits, or the analysis says why it cannot be. A class seen across models, or one that stops a run before it implements anything, is fixed ahead of one seen once. Beagle-side problems are listed in dev-notes/itc-runs/upstream.md; when one needs fixing for runs to progress across models, it is patched with a test on the choong-dev branch of the local ~/beagle checkout (never pushed), and upstream.md names the commit.",
  "dev-notes/itc-runs holds summaries with a table of every run's scorecard and the failure classes that recurred: summary.md (R01-R10), summary-R11-R20.md, and a summary of R21-R44 that compares the two prompts and the three models and says which failure classes and fixes carried across them. For each model and prompt it gives how many runs completed (every hidden test passed), how many passed any, and the best grade.",
  "dev-notes/itc-runs/mining.md reports what the existing traces (every driver and worker session of R01-R44 and B01-B03) show across runs, found by scripts in itc-harness that anyone can rerun: each beagle refusal that sent the driver to a call beagle then refused, each refusal repeated without progress, and the other bug and opportunity indicators the traces carry (time sinks, worker failure modes, tau-level stops and errors, recoveries beagle could have offered). Each finding gives its count, runs and models, and whether today's tau and beagle code still produces it; each one still live has a fix committed with a regression test or a recorded reason it was deferred.",
  "dev-notes/itc-runs holds a summary of R51-R70 that compares each q35 pursuit run with the q35 baseline for its prompt (hidden-grader result, wall time, worker and driver tokens, tasks spawned per task done) and names, for each tau or beagle mechanism the q35 traces show costing time without catching a defect, whether it was fixed, gated by model, or kept with the reason.",
]
default_budget_tokens = 150000

[report]
progress = "python3 /home/choong/tautest/itc-harness/progress.py"
