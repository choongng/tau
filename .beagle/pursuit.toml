[goal]
statement = "Make tau+beagle give a small local model (9-12B) enough structure to take a small implementation prompt (~/tautest/itc_prompt.txt, interval tree clocks; ~/tautest/cobs_prompt.txt, consistent overhead byte stuffing; each in Python via a beagle pursuit) toward a correct, committed result, learning from the traces of unattended runs and fixing tau between runs, with fixes that hold across prompts rather than fitting one."
criteria = [
  "Runs R01-R20 (itc_prompt.txt) and R21-R50 have been executed. R21-R35 cycle mimo-v2.6-9b-q4 and qwen3.5-9b-q4-mtp-thinking-coding over the unchanged itc_prompt.txt and cobs_prompt.txt, so each block of four runs pairs each model with each prompt once; R36-R50 add gemma4-12b-q4 and cycle the three models, so each block of six runs pairs each model with each prompt once. Each run records the driver's thinking level. Each run starts from a clean project directory under a one-hour wall cap, with the model passed explicitly.",
  "Each run has a trace analysis in dev-notes/itc-runs/RNN.md naming its model and prompt. It holds a scorecard (founded and on which try; tasks done/abandoned/stalled; witnessed share; commits; breaker, length stops and compactions; finished on its own or capped; hidden-grader result) and the failure classes the trace shows, whether the run succeeded or not.",
  "Each run's implementation is scored by a hidden acceptance suite for its prompt that the model never sees: for ITC, fork, event, join, leq, normalisation and the paper's examples; for COBS, the reference examples, round-trips, the no-zero and overhead properties, and malformed-input rejection.",
  "Every tau-side failure class named in a run analysis either has a fix committed on choong-dev with a regression test, made before the next run started, or a recorded reason it was deferred. A fix is stated in terms that do not depend on one prompt's domain or wording, or the analysis says why it cannot be. Beagle-side problems are listed in dev-notes/itc-runs/upstream.md and not patched.",
  "dev-notes/itc-runs holds summaries with a table of every run's scorecard and the failure classes that recurred: summary.md (R01-R10), summary-R11-R20.md, and a summary of R21-R50 that compares the two prompts and the three models and says which failure classes and fixes carried across them.",
]
default_budget_tokens = 150000
